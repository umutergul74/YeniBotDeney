name: Advisor reproducibility full gate

on:
  push:
    branches: [codex/advisor-reproducible-notebooks]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advisor-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      CUBLAS_WORKSPACE_CONFIG: ':4096:8'
      PYTHONHASHSEED: '42'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
      - name: Run the actual notebook bootstrap with local uv state
        run: |
          python scripts/bootstrap_advisor.py --repo "$GITHUB_WORKSPACE" --runtime "$RUNNER_TEMP/advisor_runtime" --cache "$RUNNER_TEMP/advisor_downloads" --receipt "$RUNNER_TEMP/advisor_receipt.json"
          python -c "import json,os,pathlib; p=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'advisor_receipt.json').read_text()); print('RESEARCH_PYTHON='+p['python'])" >> "$GITHUB_ENV"
      - name: Static compilation and generated notebook checks
        run: |
          "$RESEARCH_PYTHON" -m compileall -q yenibot scripts
          "$RESEARCH_PYTHON" scripts/build_advisor_notebooks_v2.py
          git diff --exit-code -- notebooks
      - name: One full CPU regression suite
        run: |
          mkdir -p reports
          "$RESEARCH_PYTHON" -m pytest -q --tb=short --junitxml=reports/advisor-full.xml > reports/advisor-full.log 2>&1 || { tail -n 100 reports/advisor-full.log; exit 1; }
          tail -n 12 reports/advisor-full.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: advisor-full-evidence
          path: reports/advisor-full.*
