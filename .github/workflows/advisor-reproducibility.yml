# Stable workflow/job identity; selected scope is shown in the job summary.
name: Advisor reproducibility full gate

on:
  push:
    branches: [codex/advisor-reproducible-notebooks]
  workflow_dispatch:
    inputs:
      full:
        description: Run the complete regression suite explicitly
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: advisor-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      CUBLAS_WORKSPACE_CONFIG: ':4096:8'
      PYTHONHASHSEED: '42'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
      - name: Select smallest safe test scope
        id: plan
        env:
          DIFF_BASE: ${{ github.event.before || 'HEAD^' }}
          FORCE_FULL: ${{ inputs.full || false }}
        run: |
          extra=()
          if [ "$FORCE_FULL" = "true" ]; then extra+=(--full); fi
          python scripts/advisor_test_scope.py --base "$DIFF_BASE" --head "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT" "${extra[@]}"
      - name: Validate changed Python syntax
        run: |
          python -c "import ast,json,pathlib; p=json.loads(pathlib.Path('reports/test-plan.json').read_text()); [ast.parse(pathlib.Path(f).read_text(encoding='utf-8'), filename=f) for f in p['changed_paths'] if f.endswith('.py') and pathlib.Path(f).is_file()]"
      - name: Run actual notebook bootstrap only for ML test scopes
        if: steps.plan.outputs.scope == 'targeted' || steps.plan.outputs.scope == 'full'
        run: |
          python scripts/bootstrap_advisor.py --repo "$GITHUB_WORKSPACE" --runtime "$RUNNER_TEMP/advisor_runtime" --cache "$RUNNER_TEMP/advisor_downloads" --receipt "$RUNNER_TEMP/advisor_receipt.json"
          python -c "import json,os,pathlib; p=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'advisor_receipt.json').read_text()); print('RESEARCH_PYTHON='+p['python'])" >> "$GITHUB_ENV"
      - name: Check generated notebooks only when affected
        if: steps.plan.outputs.notebooks == 'true'
        run: |
          python scripts/build_advisor_notebooks_v2.py
          git diff --exit-code -- notebooks
      - name: Run selected tests once
        if: steps.plan.outputs.scope != 'docs'
        run: |
          python scripts/advisor_test_scope.py --run reports/test-plan.json --python "${RESEARCH_PYTHON:-$(command -v python)}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: advisor-check-evidence
          path: |
            reports/test-plan.json
            reports/advisor-tests.*
